<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Translation History - English to Bangla Translator</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="history-container">
    <!-- Header -->
    <header class="history-header">
      <div class="header-brand">
        <div class="brand-badge">
          <span>অ</span>
        </div>
        <div class="brand-titles">
          <h1>Translation History</h1>
          <p>Saved vocabulary lookups, frequency analytics, and export tools</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="exportCsvBtn" class="btn btn-secondary btn-sm" title="Export as CSV spreadsheet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="svg-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <span>Export CSV</span>
        </button>

        <button type="button" id="exportJsonBtn" class="btn btn-secondary btn-sm" title="Export as JSON backup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="svg-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>Export JSON</span>
        </button>

        <button type="button" id="clearAllBtn" class="btn btn-danger btn-sm" title="Clear all translation history">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="svg-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          <span>Clear All</span>
        </button>

        <a href="options.html" class="btn btn-icon-only" title="Extension Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="svg-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </a>
      </div>
    </header>

    <!-- Filter & Search Card -->
    <section class="card filter-card">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
        <input type="text" id="searchInput" placeholder="Search saved words or Bangla translations..." autocomplete="off">
        <button type="button" id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="svg-icon">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="filter-controls-row">
        <!-- Field Filter -->
        <div class="control-group">
          <label for="filterField" class="control-label">Search In:</label>
          <select id="filterField" class="form-select">
            <option value="both">Both (English & Bangla)</option>
            <option value="en">English only</option>
            <option value="bn">Bangla only</option>
          </select>
        </div>

        <!-- Sort By -->
        <div class="control-group">
          <label for="sortBy" class="control-label">Sort By:</label>
          <select id="sortBy" class="form-select">
            <option value="recent">Recently translated</option>
            <option value="most">Most looked up</option>
            <option value="alpha">Alphabetical (English A-Z)</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Stats & Counter Bar -->
    <div class="stats-bar">
      <span id="statsSummary" class="stats-text">Loading history...</span>
      <span id="retentionLimitNotice" class="limit-hint"></span>
    </div>

    <!-- History List -->
    <main id="historyListContainer" class="history-list">
      <!-- Populated dynamically by history.js -->
    </main>

    <!-- Footer -->
    <footer class="history-footer">
      <p>💡 Tip: Double-click any English word on web pages to add it to your personal dictionary.</p>
    </footer>
  </div>

  <script src="settings.js"></script>
  <script src="tts.js"></script>
  <script src="history.js"></script>
</body>
</html>
